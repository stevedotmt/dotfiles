# List of plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Enable full color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB"

#Colors using https://github.com/jaredgorski/Mies.vim
# Status bar
set -g status-style "fg=#080808,bg=colour231"            # Status bar base style
# Window status
set -g window-status-style "fg=#767676,bg=colour231"     # Inactive windows
set -g window-status-current-style "fg=#080808,bg=colour231"  # Active window
# Pane borders
set -g pane-border-style "fg=#B0B0B0"                  # Normal pane border
set -g pane-active-border-style "fg=#767676"           # Active pane border
# Selection and copy mode
set -g mode-style "fg=#080808,bg=#B0B0B0"             # Selection highlight
set -g copy-mode-match-style "fg=#080808,bg=#B0B0B0"  # Search matches
set -g copy-mode-current-match-style "fg=#FFFFFF,bg=#767676"  # Current search match
# Command line
set -g message-style "fg=colour232,bg=colour231,fill=colour231"          # Command prompt
set -g message-command-style "fg=colour232,bg=colour231,fill=colour231"  # Command line editing
# Clock mode
set -g clock-mode-colour "#767676"                     # Clock color in clock mode
# Bells and monitoring
set -g window-status-bell-style "fg=colour160,bold"     # Using chicagoRed for bells
set -g window-status-activity-style "fg=#8E700B,bold" # Using chicagoGold for activity

# Set fish as a default shell command
set -g default-command "$SHELL --login"
set -g default-shell $SHELL

# tmux-yank: stay in copy mode after y
set -g @yank_action 'copy-pipe-no-clear'

# Support pi
set -g extended-keys on
set -g extended-keys-format csi-u

# Bindings
bind s choose-tree -sZN
# Capture the invoking session before the tree evaluates its per-item filter.
bind w run-shell -C 'choose-tree -wZ -f "##{==:##{session_id},#{session_id}}"'
bind S command-prompt -p "New Session:" "new-session -A -s '%%' -c ~"
bind T command-prompt -p "Swap Window:" "swap-window -t '%%'"
bind M command-prompt -p "Move Pane:" "move-pane -t ':%%'"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind-key a new-window -n pi -c "#{pane_current_path}" "pi"

# Vim bindings (copy mode)
setw -g mode-keys vi
bind Escape copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X begin-selection \; send -X rectangle-toggle
# Copy vim-style selections (y or Enter) to the macOS clipboard.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'

# Let tmux capture mouse drags as copy-mode selections and copy on release.
set -g mouse on
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'

# Style status line
set -g status-right '%a %Y-%m-%d %H:%M#[default]'
set -g status-left-length 100
setw -g window-status-current-format "#[bold]#I #W"
setw -g window-status-format "#[unbold]#I #W"
bind c new-window
set -g renumber-windows on  # When deleting windows renumber them.

# Disable names to windows
setw -g automatic-rename off
set-hook -g after-new-window 'rename-window ""'
set-hook -g after-new-session 'rename-window ""'

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
